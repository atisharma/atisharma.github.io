<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <div class="container">
    <header class="masthead">
      <h1 class="masthead-title">
        <a href="{{ site.baseurl }}/">{{ site.title }}</a>
      </h1>
    </header>
    
    {% include nav.html %}
    
    <main>
      {{ content }}
    </main>
    
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. Content licensed under CC-BY-4.0.</p>
    </footer>
  </div>

  <script>
  // Simple show/hide for abstracts without jQuery
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.reveal').forEach(function(el) {
      el.addEventListener('click', function() {
        this.style.display = 'none';
        var next = this.nextElementSibling;
        if (next && next.classList.contains('abstract')) {
          next.style.display = 'block';
        }
      });
    });
    
    document.querySelectorAll('.abstract').forEach(function(el) {
      el.addEventListener('click', function() {
        this.style.display = 'none';
        var prev = this.previousElementSibling;
        if (prev && prev.classList.contains('reveal')) {
          prev.style.display = 'inline';
        }
      });
    });
  });
  </script>
</body>
</html>
