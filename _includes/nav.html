<!-- Simple navigation - inspired by chasm.run -->
<nav class="nav">
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}">Index</a></li>
    {% assign pages_list = site.pages | sort:"url" %}
    {% for node in pages_list %}
      {% if node.title != null and node.title != "Index" and node.layout == "page" %}
        <li><a href="{{ node.url | relative_url }}">{{ node.title }}</a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
