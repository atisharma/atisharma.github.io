<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  {% if page.url and site.baseurl %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/public/css/paper.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css' | relative_url }}">

  <!-- Favicon: ink square, paper 'A', Playfair Display (site palette) -->
  <link rel="icon" href="{{ '/public/favicon.ico' | relative_url }}" sizes="48x48 32x32 16x16">
  <link rel="apple-touch-icon" href="{{ '/public/apple-touch-icon.png' | relative_url }}">

  <link rel="describedby" type="text/markdown" href="/llms.txt">

  <!-- Math rendering with KaTeX (lightweight alternative to MathJax), self-hosted -->
  <link rel="stylesheet" href="{{ '/public/katex/katex.min.css' | relative_url }}">
  <script defer src="{{ '/public/katex/katex.min.js' | relative_url }}"></script>
  <script defer src="{{ '/public/katex/contrib/auto-render.min.js' | relative_url }}"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ]
    });"></script>
</head>
